document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Baloo Bhaijaan 2';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"881e5823-37fc-4a6f-9a41-41ff0d068bff\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#FFF7EC;font-family:'Baloo Bhaijaan 2',sans-serif}\na{color:#FF6B57}a:hover{color:#E04B38}\n@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}\ninput,textarea{font-family:inherit}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div dir=\"rtl\" style=\"min-height: 100vh; display: flex; flex-direction: column; background: #FFF7EC;\" data-screen-label=\"ملعب المهام — نموذج تفاعلي\">\n\n  <!-- top nav -->\n  <div style=\"display: flex; align-items: center; gap: 24px; padding: 14px 32px; background: #FFFFFF; border-bottom: 3px solid #FFE3B3; position: sticky; top: 0; z-index: 20;\">\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n      <div style=\"width: 38px; height: 38px; border-radius: 12px; background: #FF6B57; display: grid; place-items: center; color: #FFF; font-weight: 800; font-size: 20px; transform: rotate(-6deg); box-shadow: 0 3px 0 #E04B38;\">م<\u002Fdiv>\n      <div style=\"font-weight: 800; font-size: 19px; color: #2B2118;\">ملعب المهام<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; gap: 6px; font-weight: 600; font-size: 15px;\">\n      <div sc-camel-on-click=\"{{ goTasks }}\" style=\"padding: 7px 16px; border-radius: 999px; cursor: pointer; background: {{ tabTasksBg }}; color: {{ tabTasksFg }};\">المهام<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goDash }}\" style=\"padding: 7px 16px; border-radius: 999px; cursor: pointer; background: {{ tabDashBg }}; color: {{ tabDashFg }};\">لوحة الإنجاز<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goLeaders }}\" style=\"padding: 7px 16px; border-radius: 999px; cursor: pointer; background: {{ tabLeadersBg }}; color: {{ tabLeadersFg }};\">المتصدرون<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goProfile }}\" style=\"padding: 7px 16px; border-radius: 999px; cursor: pointer; background: {{ tabProfileBg }}; color: {{ tabProfileFg }};\">ملفي<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-inline-start: auto; display: flex; align-items: center; gap: 12px;\">\n      <div style=\"display: flex; align-items: center; gap: 6px; background: #FFE9A8; border: 2px solid #F2C94C; border-radius: 999px; padding: 5px 14px; font-weight: 800; color: #7A5A00; font-size: 15px;\">⭐ {{ myPoints }} نقطة<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ goProfile }}\" style=\"width: 36px; height: 36px; border-radius: 999px; background: #1FB6A6; color: #FFF; display: grid; place-items: center; font-weight: 700; cursor: pointer;\">س<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- toast -->\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; top: 76px; right: 50%; transform: translateX(50%); z-index: 50; background: #2B2118; color: #F2C94C; font-weight: 700; font-size: 15px; padding: 10px 24px; border-radius: 999px; box-shadow: 0 6px 20px rgba(43,33,24,0.3); animation: pop .3s ease;\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TASKS VIEW ============ -->\n  <sc-if value=\"{{ showTasks }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display: grid; grid-template-columns: 1fr 280px; gap: 24px; padding: 24px 32px; flex: 1; align-items: start;\" data-screen-label=\"المهام\">\n      <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: flex; align-items: center; gap grid; place-items: center; font-size: 26px; transform: rotate(4deg);\">🔥<\u002Fdiv><div style=\"font-size: 12px; font-weight: 700; color: #7A6A55; text-align: center;\">7 أيام متتالية<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px;\"><div style=\"width: 56px; height: 56px; border-radius: 999px; background: #F7F3FF; border: 2px solid #C9B8F5; display: grid; place-items: center; font-size: 26px; transform: rotate(-3deg);\">🌟<\u002Fdiv><div style=\"font-size: 12px; font-weight: 700; color: #7A6A55; text-align: center;\">تقييم 5 نجوم ×10<\u002Fdiv><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; opacity: 0.4;\"><div style=\"width: 56px; height: 56px; border-radius: 999px; background: #F0EDE6; border: 2px dashed #C9C0B4; display: grid; place-items: center; font-size: 26px;\">🏅<\u002Fdiv><div style=\"font-size: 12px; font-weight: 700; color: #9A8A73; text-align: center;\">100 مهمة<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #FFF; border: 2px solid #FFE3B3; border-radius: 18px; padding: 16px 20px;\">\n        <div style=\"font-weight: 800; font-size: 16px; color: #2B2118; margin-bottom: 10px;\">آخر مهامي<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 14px;\">\n          <sc-for list=\"{{ myTasks }}\" as=\"mt\" hint-placeholder-count=\"3\">\n            <div style=\"display: flex; align-items: center; gap: 10px;\"><span style=\"flex: 1; font-weight: 600; color: #2B2118;\">{{ mt.title }}<\u002Fspan><span style=\"color: #9A8A73; font-weight: 500;\">{{ mt.time }}<\u002Fspan><span style=\"color: #B87A00; letter-spacing: 1px;\">{{ mt.stars }}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ NEW TASK MODAL ============ -->\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position: fixed; inset: 0; background: rgba(43,33,24,0.45); z-index: 40; display: grid; place-items: center; padding: 20px;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"background: #FFF; border: 2px solid #FFE3B3; border-radius: 22px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; width: 520px; max-width: 100%; box-sizing: border-box; animation: pop .25s ease;\">\n        <div style=\"display: flex; align-items: center; gap: 12px;\">\n          <div style=\"width: 42px; height: 42px; border-radius: 14px; background: #FF6B57; display: grid; place-items: center; color: #FFF; font-size: 22px; transform: rotate(-6deg); box-shadow: 0 3px 0 #E04B38;\">✏️<\u002Fdiv>\n          <div>\n            <div style=\"font-weight: 800; font-size: 21px; color: #2B2118;\">مهمة جديدة<\u002Fdiv>\n            <div style=\"font-size: 13.5px; color: #9A8A73; font-weight: 500;\">يبدأ المؤقّت تلقائيًا عند بدء التنفيذ<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeModal }}\" style=\"margin-inline-start: auto; width: 32px; height: 32px; border-radius: 999px; background: #FFEFD6; color: #9A8A73; display: grid; place-items: center; font-weight: 700; cursor: pointer;\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <label style=\"font-weight: 700; font-size: 14.5px; color: #2B2118;\">عنوان المهمة<\u002Flabel>\n          <input value=\"{{ formTitle }}\" sc-camel-on-change=\"{{ onFormTitle }}\" placeholder=\"مثال: تجهيز عرض العميل\" style=\"font-size: 16px; font-weight: 600; color: #2B2118; background: #FFF7EC; border: 2px solid {{ titleBorder }}; border-radius: 14px; padding: 12px 16px; outline: none;\">\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <label style=\"font-weight: 700; font-size: 14.5px; color: #2B2118;\">وصف المهمة<\u002Flabel>\n          <textarea value=\"{{ formDesc }}\" sc-camel-on-change=\"{{ onFormDesc }}\" rows=\"3\" placeholder=\"اشرح المطلوب حتى يقيّمك زميلك بعدل ⭐\" style=\"font-size: 15px; font-weight: 500; color: #2B2118; background: #FFF7EC; border: 2px solid #FFE3B3; border-radius: 14px; padding: 12px 16px; outline: none; resize: none;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 8px;\">\n          <label style=\"font-weight: 700; font-size: 14.5px; color: #2B2118;\">التصنيف<\u002Flabel>\n          <div style=\"display: flex; gap: 8px; flex-wrap: wrap;\">{{ categoryChips }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; margin-top: 4px;\">\n          <div sc-camel-on-click=\"{{ createTask }}\" style=\"flex: 1; text-align: center; background: #1FB6A6; color: #FFF; font-weight: 800; font-size: 16px; padding: 13px; border-radius: 999px; box-shadow: 0 3px 0 #148F82; cursor: pointer;\">▶ إنشاء وبدء المؤقّت<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const now = Date.now();\n    this.users = [\n      { id: 'sara', name: 'سارة', initial: 'س', color: '#1FB6A6' },\n      { id: 'ahmed', name: 'أحمد', initial: 'أ', color: '#FF9F43' },\n      { id: 'noura', name: 'نورة', initial: 'ن', color: '#8B5CF6' },\n      { id: 'khaled', name: 'خالد', initial: 'خ', color: '#FF6B57' },\n      { id: 'mhd', name: 'محمد', initial: 'م', color: '#3D9BE9' }\n    ];\n    this.state = {\n      view: 'tasks', filter: 'all', modalOpen: false, toast: '',\n      formTitle: '', formDesc: '', formCat: 'تصميم', titleError: false,\n      tick: 0,\n      ratings: {},\n      tasks: [\n        { id: 1, title: 'تجهيز عرض العميل الجديد', desc: '', cat: 'مبيعات', owner: 'ahmed', status: 'running', startedAt: now - 3765000 },\n        { id: 2, title: 'تصميم صفحة الهبوط', desc: 'مع نسخة الجوال وقسم الأسئلة الشائعة', cat: 'تصميم', owner: 'noura', status: 'review', elapsedMs: 9600000 },\n        { id: 3, title: 'تحديث قائمة العملاء', desc: '', cat: 'إداري', owner: 'sara', status: 'review', elapsedMs: 2520000 },\n        { id: 4, title: 'مراجعة تقرير المبيعات', desc: '', cat: 'مبيعات', owner: 'khaled', status: 'done', elapsedMs: 4500000, stars: 4, ratedBy: 'محمد' },\n        { id: 5, title: 'حملة السوشيال ميديا', desc: '', cat: 'تصميم', owner: 'sara', status: 'done', elapsedMs: 3300000, stars: 5, ratedBy: 'أحمد' },\n        { id: 6, title: 'إعداد اجتماع الربع', desc: '', cat: 'إداري', owner: 'mhd', status: 'done', elapsedMs: 5400000, stars: 4, ratedBy: 'سارة' }\n      ],\n      basePoints: { sara: 118, ahmed: 117, noura: 98, khaled: 68, mhd: 56 }\n    };\n  }\n\n  componentDidMount() { this.timer = setInterval(() => this.setState(s => ({ tick: s.tick + 1 })), 1000); }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  fmt(ms) {\n    const total = Math.max(0, Math.floor(ms / 1000));\n    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;\n    const p = n => String(n).padStart(2, '0');\n    return `${p(h)}:${p(m)}:${p(s)}`;\n  }\n  fmtDur(ms) {\n    const total = Math.floor(ms / 60000);\n    const h = Math.floor(total / 60), m = total % 60;\n    return h > 0 ? `${h}س ${m}د` : `${m}د`;\n  }\n  user(id) { return this.users.find(u => u.id === id); }\n  starsStr(n) { return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }\n\n  points(uid) {\n    let pts = this.state.basePoints[uid] || 0;\n    this.state.tasks.forEach(t => { if (t.owner === uid && t.status === 'done' && t.stars) pts += t.stars * 2; });\n    return pts;\n  }\n\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this.toastT);\n    this.toastT = setTimeout(() => this.setState({ toast: '' }), 2600);\n  }\n\n  finishTask(id) {\n    this.setState(s => ({\n      tasks: s.tasks.map(t => t.id === id ? { ...t, status: 'review', elapsedMs: Date.now() - t.startedAt } : t)\n    }));\n    this.showToast('🎉 أُنهيت المهمة — بانتظار تقييم زميل');\n  }\n\n  submitRating(id) {\n    const stars = this.state.ratings[id] || 0;\n    if (!stars) { this.showToast('اختر عدد النجوم أولًا ⭐'); return; }\n    this.setState(s => ({\n      tasks: s.tasks.map(t => t.id === id ? { ...t, status: 'done', stars, ratedBy: 'سارة' } : t)\n    }));\n    this.showToast(`⭐ منحت ${stars} نجوم (+${stars * 2} نقاط)`);\n  }\n\n  createTask() {\n    const title = this.state.formTitle.trim();\n    if (!title) { this.setState({ titleError: true }); this.showToast('اكتب عنوان المهمة أولًا ✏️'); return; }\n    const t = { id: Date.now(), title, desc: this.state.formDesc.trim(), cat: this.state.formCat, owner: 'sara', status: 'running', startedAt: Date.now() };\n    this.setState(s => ({ tasks: [t, ...s.tasks], modalOpen: false, formTitle: '', formDesc: '', titleError: false, filter: 'all' }));\n    this.showToast('▶ بدأ المؤقّت — بالتوفيق!');\n  }\n\n  starEls(id) {\n    const val = this.state.ratings[id] || 0;\n    return [1, 2, 3, 4, 5].map(i =>\n      React.createElement('span', {\n        key: i,\n        onClick: () => this.setState(s => ({ ratings: { ...s.ratings, [id]: i } })),\n        style: { cursor: 'pointer', color: i <= val ? '#F2C94C' : '#E4DCCB', userSelect: 'none' }\n      }, '★')\n    );\n  }\n\n  renderVals() {\n    const s = this.state;\n    const me = 'sara';\n    const labels = ['', 'يحتاج تحسين', 'مقبول', 'جيد 👍', 'ممتاز! 👏', 'أسطوري! 🤩'];\n\n    const tab = v => s.view === v;\n    const tabBg = v => tab(v) ? '#2B2118' : 'transparent';\n    const tabFg = v => tab(v) ? '#FFFFFF' : '#7A6A55';\n    const fSel = f => s.filter === f;\n    const fBg = f => fSel(f) ? '#2B2118' : '#FFFFFF';\n    const fFg = f => fSel(f) ? '#FFFFFF' : '#7A6A55';\n    const fBr = f => fSel(f) ? '#2B2118' : '#FFE3B3';\n\n    const tasks = s.tasks.filter(t => {\n      if (s.filter === 'run') return t.status === 'running';\n      if (s.filter === 'rev') return t.status === 'review';\n      if (s.filter === 'done') return t.status === 'done';\n      return true;\n    });\n\n    const visibleTasks = tasks.map(t => {\n      const u = this.user(t.owner);\n      const isMine = t.owner === me;\n      const isReviewMine = t.status === 'review' && !isMine;\n      let meta = u.name;\n      if (t.status === 'running') meta = `${u.name} · جارٍ التنفيذ`;\n      if (t.status === 'review') meta = `${u.name} · أنهاها في ${this.fmtDur(t.elapsedMs)}`;\n      if (t.status === 'done') meta = `${u.name} · ${this.fmtDur(t.elapsedMs)} · قيّمها ${t.ratedBy}`;\n      return {\n        title: t.title, desc: t.desc, meta,\n        initial: u.initial, color: u.color,\n        border: isReviewMine ? '#C9B8F5' : '#FFE3B3',\n        isRunning: t.status === 'running',\n        canFinish: t.status === 'running' && isMine,\n        isDone: t.status === 'done',\n        isReviewMine,\n        isReviewOthers: t.status === 'review' && isMine,\n        timer: t.status === 'running' ? this.fmt(Date.now() - t.startedAt) : '',\n        doneStars: t.stars ? this.starsStr(t.stars) : '',\n        points: t.stars ? t.stars * 2 : 0,\n        starEls: this.starEls(t.id),\n        ratingLabel: labels[s.ratings[t.id] || 0] || '',\n        submitBg: (s.ratings[t.id] || 0) ? '#8B5CF6' : '#C9B8F5',\n        onFinish: () => this.finishTask(t.id),\n        onSubmit: () => this.submitRating(t.id)\n      };\n    });\n\n    const doneTasks = s.tasks.filter(t => t.status === 'done');\n    const runCount = s.tasks.filter(t => t.status === 'running').length;\n    const revCount = s.tasks.filter(t => t.status === 'review').length;\n    const teamAvg = doneTasks.length ? (doneTasks.reduce((a, t) => a + t.stars, 0) / doneTasks.length).toFixed(1) : '—';\n\n    const stats = this.users.map(u => {\n      const mine = doneTasks.filter(t => t.owner === u.id);\n      const avg = mine.length ? (mine.reduce((a, t) => a + t.stars, 0) / mine.length).toFixed(1) : '—';\n      const avgTime = mine.length ? mine.reduce((a, t) => a + t.elapsedMs, 0) / mine.length : Infinity;\n      return { ...u, count: mine.length, avg, avgTime, pts: this.points(u.id) };\n    });\n    const maxCount = Math.max(1, ...stats.map(m => m.count));\n    const memberStats = stats.slice().sort((a, b) => b.count - a.count).map(m => ({ ...m, pct: Math.round(m.count / maxCount * 100) + '%' }));\n    const fastest = stats.filter(m => m.count > 0).sort((a, b) => a.avgTime - b.avgTime)[0] || stats[0];\n\n    const sorted = stats.slice().sort((a, b) => b.pts - a.pts);\n    const rankColors = ['#F2C94C', '#C9C0B4', '#D8956B'];\n    const miniLeaders = sorted.slice(0, 3).map((m, i) => ({ rank: i + 1, name: m.id === me ? 'أنت' : m.name, pts: m.pts, rankColor: rankColors[i] }));\n    const leaderRows = sorted.map((m, i) => ({\n      rank: i + 1, name: m.id === me ? `${m.name} (أنت)` : m.name, initial: m.initial, color: m.color,\n      tasks: m.count, avg: m.avg, pts: m.pts, bg: m.id === me ? '#FFFBF0' : '#FFFFFF'\n    }));\n\n    const myDoneTasks = doneTasks.filter(t => t.owner === me);\n    const myAvg = myDoneTasks.length ? (myDoneTasks.reduce((a, t) => a + t.stars, 0) / myDoneTasks.length).toFixed(1) : '—';\n    const myTime = myDoneTasks.length ? this.fmtDur(myDoneTasks.reduce((a, t) => a + t.elapsedMs, 0) / myDoneTasks.length) : '—';\n\n    const cats = ['تصميم', 'مبيعات', 'تطوير', 'إداري'];\n    const catIcons = { 'تصميم': '🎨', 'مبيعات': '📈', 'تطوير': '💻', 'إداري': '📝' };\n    const categoryChips = cats.map(c => {\n      const sel = s.formCat === c;\n      return React.createElement('div', {\n        key: c,\n        onClick: () => this.setState({ formCat: c }),\n        style: {\n          padding: '7px 16px', borderRadius: '999px', cursor: 'pointer', fontWeight: sel ? 700 : 600, fontSize: '14px',\n          background: sel ? '#FF6B57' : '#FFF7EC', color: sel ? '#FFF' : '#7A6A55',\n          border: sel ? '2px solid #FF6B57' : '2px solid #FFE3B3',\n          boxShadow: sel ? '0 3px 0 #E04B38' : 'none'\n        }\n      }, `${catIcons[c]} ${c}`);\n    });\n\n    return {\n      showTasks: s.view === 'tasks', showDash: s.view === 'dash', showLeaders: s.view === 'leaders', showProfile: s.view === 'profile',\n      goTasks: () => this.setState({ view: 'tasks' }),\n      goDash: () => this.setState({ view: 'dash' }),\n      goLeaders: () => this.setState({ view: 'leaders' }),\n      goProfile: () => this.setState({ view: 'profile' }),\n      tabTasksBg: tabBg('tasks'), tabTasksFg: tabFg('tasks'),\n      tabDashBg: tabBg('dash'), tabDashFg: tabFg('dash'),\n      tabLeadersBg: tabBg('leaders'), tabLeadersFg: tabFg('leaders'),\n      tabProfileBg: tabBg('profile'), tabProfileFg: tabFg('profile'),\n      filterAll: () => this.setState({ filter: 'all' }), filterRun: () => this.setState({ filter: 'run' }),\n      filterRev: () => this.setState({ filter: 'rev' }), filterDone: () => this.setState({ filter: 'done' }),\n      fAllBg: fBg('all'), fAllFg: fFg('all'), fAllBr: fBr('all'),\n      fRunBg: fBg('run'), fRunFg: fFg('run'), fRunBr: fBr('run'),\n      fRevBg: fBg('rev'), fRevFg: fFg('rev'), fRevBr: fBr('rev'),\n      fDoneBg: fBg('done'), fDoneFg: fFg('done'), fDoneBr: fBr('done'),\n      visibleTasks, emptyList: visibleTasks.length === 0,\n      toast: s.toast,\n      myPoints: this.points(me),\n      doneCount: doneTasks.length, totalCount: s.tasks.length,\n      donePct: Math.round(doneTasks.length / Math.max(1, s.tasks.length) * 100) + '%',\n      runCount, revCount, teamAvg,\n      memberStats, miniLeaders, leaderRows,\n      fastName: fastest.name, fastInitial: fastest.initial, fastColor: fastest.color,\n      fastTime: fastest.avgTime !== Infinity ? this.fmtDur(fastest.avgTime) : '—',\n      p1: sorted[0], p2: sorted[1], p3: sorted[2],\n      myDone: myDoneTasks.length, myAvg, myTime,\n      myTasks: myDoneTasks.map(t => ({ title: t.title, time: this.fmtDur(t.elapsedMs), stars: this.starsStr(t.stars) })),\n      modalOpen: s.modalOpen,\n      openModal: () => this.setState({ modalOpen: true }),\n      closeModal: () => this.setState({ modalOpen: false, titleError: false }),\n      stopProp: e => e.stopPropagation(),\n      formTitle: s.formTitle, formDesc: s.formDesc,\n      onFormTitle: e => this.setState({ formTitle: e.target.value, titleError: false }),\n      onFormDesc: e => this.setState({ formDesc: e.target.value }),\n      titleBorder: s.titleError ? '#FF6B57' : '#FFE3B3',\n      categoryChips,\n      createTask: () => this.createTask()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
